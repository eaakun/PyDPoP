name: supply-chain

# Verifiable supply-chain artifacts for pydpop releases.
#
# STATUS: VERIFIED via workflow_dispatch (2026-11-24) after two
# startup failures at the v0.2.2 release (the provenance job needed
# contents: write; upload-assets is release-only). Dispatch verified
# build + Sigstore signing + SBOM + SLSA provenance end to end and
# `dpop audit-release` passes 8/10 on the artifacts (the SBOM checks
# were the gap — the SBOM step now scans the installed distribution).
# The release-event path differs only in upload-assets: true; it runs
# on the next published release. See docs/supply-chain.md.
#
# What it does, per the project owner's 2026-11-12 ruling (the
# DPoP-style release proof was WITHDRAWN — no custom artifact binding
# is built anywhere; the release chain uses only standard,
# independently verifiable artifacts):
#   - SLSA Build Level 3 provenance via the official generator
#   - Sigstore keyless signing of wheel/sdist
#   - CycloneDX SBOM publication
# Downstream can run `dpop audit-release` to consistency-check a
# release directory (provenance subjects vs files, tag vs provenance
# commit, SBOM deps vs pyproject).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Sigstore keyless signing + SLSA provenance

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.1.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Install distribution for SBOM scan
        run: |
          python -m venv "${{ runner.temp }}/sbom-venv"
          "${{ runner.temp }}/sbom-venv/bin/pip" install ./dist/*.whl
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ runner.temp }}/sbom-venv
          format: cyclonedx-json
          output-file: ./dist/sbom.cyclonedx.json
      - name: Hash subjects for provenance
        id: hash
        run: |
          (cd dist && sha256sum *.tar.gz *.whl) | base64 -w0 > /tmp/digests.txt
          echo "digests=$(cat /tmp/digests.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  provenance:
    needs: [build]
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      upload-assets: ${{ github.event_name == 'release' }}
