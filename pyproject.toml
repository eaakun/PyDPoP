[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydpop"
version = "0.2.0"
description = "RFC 9449 DPoP (Demonstrating Proof of Possession) for Python — ES256 + post-quantum hybrid (ML-DSA) proof generation and verification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "pydpop contributors" }]
keywords = ["dpop", "oauth", "oauth2.1", "rfc9449", "proof-of-possession", "jwt", "jws", "mcp", "model-context-protocol", "post-quantum", "pqc", "ml-dsa", "dilithium", "hybrid-signatures", "sender-constrained", "token-binding", "cryptography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
requests = ["requests>=2.28"]

[project.scripts]
dpop = "pydpop.cli:main"

[project.urls]
Homepage = "https://github.com/eaakun/PyDPoP"
Repository = "https://github.com/eaakun/PyDPoP"

[tool.hatch.build.targets.wheel]
packages = ["src/pydpop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
